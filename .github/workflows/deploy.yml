name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Adresse provisoire : https://elmehdibel.github.io/jlm-alumni-site
  # Le jour où jlmalumni.com pointe vers GitHub Pages : vider BASE_PATH, mettre SITE_URL à https://jlmalumni.com
  # et ajouter le fichier public/CNAME contenant « jlmalumni.com ».
  BASE_PATH: /jlm-alumni-site
  SITE_URL: https://elmehdibel.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
